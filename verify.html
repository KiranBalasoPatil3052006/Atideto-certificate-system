<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Verify ATIDETO internship certificates by entering the certificate ID.">
<title>ATIDETO — Certificate Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Playfair+Display:wght@800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="verify.css">
</head>
<body>

  <nav class="admin-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">ATIDETO <span>Certificate System</span></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="preview.html" class="nav-link">Certificate Preview</a>
        <a href="offer-letter-preview.html" class="nav-link">Offer Letter Review</a>
        <a href="verify.html" class="nav-link active">Verify</a>
      </div>
    </div>
  </nav>

  <main class="verify-main">
    <div class="verify-search">
      <h1>Certificate Verification</h1>
      <p>Enter a certificate ID to verify its authenticity</p>
      <div class="search-box">
        <input type="text" id="certIdInput" placeholder="e.g. AT-IC-JFS-2026-0042" value="">
        <button id="verifyBtn" class="btn btn-primary">Verify</button>
      </div>
    </div>

    <div id="verifyLoading" class="loading hidden">Verifying certificate...</div>
    <div id="verifyError" class="verify-card verify-error hidden"></div>

    <div id="verifyResult" class="verify-result hidden">
      <!-- Status Banner -->
      <div id="statusBanner" class="status-banner"></div>

      <!-- Certificate Preview -->
      <div id="certPreviewWrap" class="cert-preview-wrap"></div>

      <!-- Details Card -->
      <div id="detailsCard" class="verify-card"></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="api.js"></script>
  <script src="verify.js"></script>
</body>
</html>
